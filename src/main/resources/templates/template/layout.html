<!DOCTYPE html>
<html
        lang="en"
        class="dark-style layout-navbar-fixed layout-menu-fixed"
        dir="ltr"
        data-theme="theme-default"
        th:data-assets-path="@{/assets/}"
        data-template="vertical-menu-template"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        xmlns:th="http://www.thymeleaf.org">

<head layout:replace="~{template/fragments/head}">
    <title>Заголовок по умолчанию из layout.html</title>
</head>

<body>
<!-- Layout wrapper -->
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
        <!-- Menu -->
        <aside layout:replace="~{template/fragments/aside}">

        </aside>
        <!-- / Menu -->

        <!-- Layout container -->
        <div class="layout-page">
            <!-- Navbar -->
            <nav layout:replace="~{template/fragments/nav}"
                 class="layout-navbar container-xxl navbar-detached navbar navbar-expand-xl align-items-center bg-navbar-theme"
                 id="layout-navbar">

            </nav>

            <div layout:replace="~{template/fragments/scripts}">
                <!-- Это содержимое будет заменено -->
            </div>

            <!-- Content wrapper -->
            <div class="content-wrapper">
                <!-- Content -->
                <div class="container-xxl flex-grow-1 container-p-y" layout:fragment="content">
                    <!-- Сюда будет вставлен основной контент со страницы -->
                    <h4 class="fw-bold py-3 mb-4">Page 1</h4>
                    <p>Sample page.</p>
                </div>
                <!-- / Content -->

                <!-- Footer -->
                <footer layout:replace="~{template/fragments/footer}" class="content-footer footer bg-footer-theme">
                    <!-- ... остальной футер ... -->
                </footer>
                <!-- / Footer -->

                <div class="content-backdrop fade"></div>
            </div>
            <!-- Content wrapper -->
        </div>
        <!-- / Layout page -->
    </div>

    <!-- Overlay -->
    <div class="layout-overlay layout-menu-toggle"></div>
    <div class="drag-target"></div>
</div>
</body>
</html>
