<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template/layout.html}" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.ultraq.net.nz/thymeleaf/layout ">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center py-3 mb-4">
        <h4 class="fw-bold m-0" data-i18n="banners.name">Баннеры</h4>
    </div>

    <div class="main-card mb-3 card" id="card-block">
        <div class="card-header py-2">
            <div class="row w-100 align-items-center justify-content-end">


                <div class="col-lg-2 col-md-4 col-sm-4">

                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped table-bordered">
                    <thead>
                    <tr>
                        <th style="width: 50%;" data-i18n="banner.name">Название</th>
                        <th style="width: 30%;" data-i18n="banner.status">Статус</th>
                        <th class="text-center" style="width: 20%;" data-i18n="banner.actions">Действия</th>
                    </tr>
                    </thead>
                    <tbody id="bannerTableBody">
                    <!-- Данные таблицы -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer d-flex justify-content-between align-items-center py-3">
        </div>

    </div>
    <script th:inline="javascript">
        window.contextPath = '[[@{/}]]'.replaceAll('"', '');
        document.addEventListener('DOMContentLoaded', function() {
            loadBanners();
        });

        function loadBanners() {
            fetch(contextPath+'banner/getAll')
                .then(response => response.json())
                .then(data => {
                    displayBanners(data);
                })
                .catch(error => {
                    console.error('Ошибка при загрузке баннеров:', error);
                });
        }

        function displayBanners(banners) {
            const tableBody = document.getElementById('bannerTableBody');
            tableBody.innerHTML = '';

            banners.forEach(banner => {
                const row = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.textContent = banner.name;
                row.appendChild(nameCell);

                const statusCell = document.createElement('td');
                statusCell.textContent = banner.status ? 'Активен' : 'Неактивен';
                row.appendChild(statusCell);

                const actionsCell = document.createElement('td');
                actionsCell.className = 'text-center';
                
                const editButton = document.createElement('button');
                editButton.className = 'btn btn-sm btn-primary';
                editButton.innerHTML = '<i class="fas fa-edit"></i>';
                editButton.onclick = function() {
                    window.location.href = contextPath+'banner/edit/' + banner.id;
                };
                
                actionsCell.appendChild(editButton);
                row.appendChild(actionsCell);
                
                tableBody.appendChild(row);
            });
        }
    </script>

    <script th:src="@{/assets/js/main.js}"></script>

    <script>
        function localize() {
            let i18nList = document.querySelectorAll('[data-i18n]');

            let currentLanguageEle = document.querySelector('.dropdown-item[data-language="' + i18next.language + '"]');

            if (currentLanguageEle) {
                currentLanguageEle.click();
            }

            i18nList.forEach(function (item) {
                item.innerHTML = i18next.t(item.dataset.i18n);
            });
        }

        localize();
    </script>

</div>
</body>
</html>
