<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template/layout.html}" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.ultraq.net.nz/thymeleaf/layout ">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center py-3 mb-4">
        <h4 class="fw-bold m-0" data-i18n="builderObjects">Объекты от строителей</h4>
    </div>

    <div class="main-card mb-3 card" id="card-block">
        <div class="card-header py-2">
            <div class="row w-100 align-items-center justify-content-end">
                <div class="col-lg-2 col-md-4 col-sm-4">
                    <a href="" class="btn btn-primary btn-sm w-100" id="btn-write">
                        <span data-i18n="print">Роспечатать</span>
                    </a>
                </div>
                <div class="col-lg-auto col-md-4 col-sm-4">
                    <a th:href="@{/personal/create}" class="btn btn-primary btn-sm w-100" id="createEntity">
                        <span data-i18n="personal.addUser">Добавить пользователя</span>
                        <i class="ti ti-plus"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="card-body" id="table-for-print">
            <div class="table-responsive">
                <table style="width: 100%;" class="table table-hover table-striped table-bordered">
                    <thead>
                    <tr>
                        <th data-i18n="builder.name">Название</th>
                        <th data-i18n="builder.district">Район</th>
                        <th data-i18n="builder.topozone">Топозона</th>
                        <th data-i18n="builder.street">Улица</th>
                        <th data-i18n="builder.totalFloor">Этажность</th>
                        <th class="text-center" data-i18n="personal.actions">Действия</th>
                    </tr>
                    <!-- Filter Row -->
                    <tr>
                        <th><input type="text" class="form-control form-control-sm filter-input"
                                   data-filter-key="name"></th>
                        <th><input type="text" class="form-control form-control-sm filter-input"
                                   data-filter-key="nameDistinct"></th>
                        <th><input type="text" class="form-control form-control-sm filter-input"
                                   data-filter-key="nameTopozone"></th>
                        <th><input type="text" class="form-control form-control-sm filter-input"
                                   data-filter-key="street"></th>
                        <th><input type="text" class="form-control form-control-sm filter-input"
                                   data-filter-key="totalFloor"
                                   data-i18n="[placeholder]personal.phoneNumberPlaceholder"></th>
                        <th class="text-center">
                            <button type="button" id="clearFiltersBtn" class="btn btn-light btn-sm"
                                    data-i18n="personal.clearFilters">Очистить
                            </button>
                        </th>
                    </tr>
                    </thead>
                    <tbody id="builderTableBody">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center py-3">
            <label class="d-flex align-items-center gap-1 mb-0">
                <select id="pageSize" class="custom-select custom-select-sm form-control form-control-sm mx-2"
                        style="width: auto;">
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </label>
            <nav aria-label="Навигация по страницам">
                <ul class="pagination mb-0" id="pagination">
                    <li class="page-item disabled"><a class="page-link" href="#" tabindex="-1"
                                                      aria-disabled="true">«</a></li>
                    <li class="page-item"><a class="page-link" href="#">1</a></li>
                    <li class="page-item active"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#">»</a></li>
                </ul>
            </nav>
        </div>

        <!-- Модальное окно подтверждения удаления -->
        <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteConfirmModalLabel" data-i18n="personal.confirmDeletion">
                            Подтверждение удаления</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Закрыть"></button>
                    </div>
                    <div class="modal-body">
                        <span data-i18n="personal.confirmDeletionMessage">Вы уверены, что хотите удалить этого пользователя?</span>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-label-secondary"
                                data-bs-dismiss="modal" data-i18n="personal.cancel">Отменить
                        </button>
                        <button type="button" class="btn btn-danger" id="confirm-delete-btn"
                                data-i18n="personal.delete">Удалить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function printTable() {
            const rowsPerPage = 20;
            const tableElement = document.getElementById('table-for-print');
            const originalContents = document.body.innerHTML;

            if (!tableElement) {
                console.error('Table element not found!');
                return;
            }

            const clonedTable = tableElement.cloneNode(true);
            const rows = Array.from(clonedTable.querySelectorAll('tr'));
            const totalPages = Math.ceil(rows.length / rowsPerPage);

            const printContainer = document.createElement('div');

            for (let page = 0; page < totalPages; page++) {
                const pageContainer = document.createElement('div');
                pageContainer.classList.add('print-page');

                const header = document.createElement('h2');
                header.textContent = `Page ${page + 1} of ${totalPages}`;
                pageContainer.appendChild(header);

                const pageTable = document.createElement('table');
                pageTable.classList.add('print-table');

                if (page === 0) {
                    const headerRow = rows[0].cloneNode(true);
                    pageTable.appendChild(headerRow);
                }

                const startRow = page * rowsPerPage + 1;
                const endRow = Math.min(startRow + rowsPerPage, rows.length);
                for (let i = startRow; i < endRow; i++) {
                    const row = rows[i].cloneNode(true);
                    pageTable.appendChild(row);
                }

                pageContainer.appendChild(pageTable);
                printContainer.appendChild(pageContainer);
            }

            document.body.innerHTML = '';
            document.body.appendChild(printContainer);

            window.print();

            document.body.innerHTML = originalContents;
            location.reload();
        }
    </script>
    <script>
        let personalAppInstance = null;
        let isTableInitialized = false;
        const enableViewButton = true;

        function initializePersonalTable({enableView = true} = {}) {
            if (isTableInitialized) return;
            // If an existing app instance exists and has a destroy method, destroy it
            if (personalAppInstance && typeof personalAppInstance.destroy === 'function') {
                personalAppInstance.destroy();
            }
            // Optionally clear the table body to avoid duplicates
            const tbody = document.getElementById('builderTableBody');
            if (tbody) {
                tbody.innerHTML = '';
            }
            // Rebuild the config with updated translations
            let baseURL = '[[@{/}]]'.replaceAll("\"", "");
            const appConfig = {
                api: {
                    baseURL: baseURL,
                    endpoints: {
                        getAll: 'builder/getAllBuilders',
                        delete: 'builder/{id}',
                    }
                },
                entityName: i18next.t('personal.personal'),
                tableBodyId: 'builderTableBody',
                columns: [
                    {key: 'name'},
                    {key: 'nameDistinct'},
                    {key: 'nameTopozone'},
                    {key: 'street'},
                    {key: 'totalFloor'},
                ],
                paginationId: 'pagination',
                paginationEdgePages: 3,
                deleteModalId: 'deleteConfirmModal',
                confirmDeleteBtnId: 'confirm-delete-btn',
                pageSizeSelectId: 'pageSize',
                createButtonId: 'createEntity',
                filterInputSelector: '.filter-input',
                clearFiltersBtnId: 'clearFiltersBtn',
                createUrl: baseURL + 'builder/create',
                editUrl: baseURL + 'builder/edit/',
                notificationKeyword: 'message',
                viewUrl: enableView ? baseURL + 'builder/view/' : null
            };
            personalAppInstance = new GenericCRUDApp(appConfig);
            isTableInitialized = true;
        }

        document.addEventListener('DOMContentLoaded', function () {
            initializePersonalTable();
            document.getElementById('btn-write').addEventListener('click', function () {
                printTable();
            });
        });
    </script>
    <script>
        if (typeof i18next !== 'undefined' && typeof i18NextHttpBackend !== 'undefined') {

            const storedLang = localStorage.getItem('userLanguage');
            const defaultLang = 'en';
            let initialLang = storedLang || defaultLang;

            if (!storedLang) {
                localStorage.setItem('userLanguage', defaultLang);
            }


            i18next
                .use(i18NextHttpBackend)
                .init({
                    lng: initialLang,
                    debug: false,
                    fallbackLng: 'en',
                    backend: {
                        loadPath: assetsPath + 'json/locales/{{lng}}.json'
                    },
                    returnObjects: true
                })
                .then(function (t) {
                    localize();
                    initializePersonalTable();
                });
        }

        let languageDropdown = document.getElementsByClassName('dropdown-language');

        if (languageDropdown.length) {
            let dropdownItems = languageDropdown[0].querySelectorAll('.dropdown-item');

            for (let i = 0; i < dropdownItems.length; i++) {
                dropdownItems[i].addEventListener('click', function () {
                    let currentLanguage = this.getAttribute('data-language'),
                        selectedLangFlag = this.querySelector('.fi').getAttribute('class');

                    for (let sibling of this.parentNode.children) {
                        sibling.classList.remove('selected');
                    }
                    this.classList.add('selected');

                    languageDropdown[0].querySelector('.dropdown-toggle .fi').className = selectedLangFlag;


                    localStorage.setItem('userLanguage', currentLanguage);

                    i18next.changeLanguage(currentLanguage, (err, t) => {
                        if (err) return console.log('something went wrong loading', err);
                        localize();
                        initializePersonalTable();
                    });
                });
            }
        }

        function localize() {
            let i18nList = document.querySelectorAll('[data-i18n]');

            let currentLanguageEle = document.querySelector('.dropdown-item[data-language="' + i18next.language + '"]');

            if (currentLanguageEle) {
                currentLanguageEle.click();
            }

            i18nList.forEach(function (item) {
                item.innerHTML = i18next.t(item.dataset.i18n);
            });
        }
    </script>
    <script>
        let i18nList = document.querySelectorAll('[data-i18n]');

        let currentLanguageEle = document.querySelector('.dropdown-item[data-language="' + i18next.language + '"]');

        if (currentLanguageEle) {
            currentLanguageEle.click();
        }

        i18nList.forEach(function (item) {
            item.innerHTML = i18next.t(item.dataset.i18n);
        });
    </script>
</div>
</body>
</html>
